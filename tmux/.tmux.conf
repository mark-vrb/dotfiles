# Copy mode Vim keybindings
set-window-option -g mode-keys vi

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""

# Theme (matches Neovim default light colorscheme)
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#ffffff,bg=#4169e1,bold] #S #[bg=default] "
set -g status-right "#[fg=#0000ff]#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#a9a9a9]#h "
set -g window-status-format "#[fg=#a9a9a9] #I:#W "
set -g window-status-current-format "#[fg=#0000ff,bold] #I:#W "
set -g pane-border-style "fg=#a9a9a9"
set -g pane-active-border-style "fg=#0000ff"
set -g message-style "bg=default,fg=#0000ff"
set -g message-command-style "bg=default,fg=#0000ff"
set -g mode-style "bg=#4169e1,fg=#ffffff"
setw -g clock-mode-colour "#0000ff"
